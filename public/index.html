<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Finch Sandbox Explorer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1>Finch Sandbox Explorer</h1>
    <p class="subtitle">Pick a provider to create a sandbox connection and view its company, directory, individual, and employment data.</p>
  </header>

  <main>
    <section class="card">
      <form id="connect-form">
        <label>
          Provider
          <select id="provider-select" required>
            <option value="">Loading providers…</option>
          </select>
        </label>
        <label>
          Authentication type
          <select id="auth-select" required disabled></select>
        </label>
        <button type="submit" id="connect-button" disabled>Connect</button>
      </form>
      <p id="connect-status" class="status" role="status"></p>
    </section>

    <div id="results" hidden>
      <section class="card">
        <h2>Company</h2>
        <div id="company"></div>
      </section>

      <div class="columns">
        <section class="card">
          <h2>Directory <span id="directory-count" class="muted"></span></h2>
          <div id="directory"></div>
        </section>

        <section class="card" id="employee-panel">
          <h2>Employee details</h2>
          <div id="employee">
            <p class="muted">Select an employee from the directory.</p>
          </div>
        </section>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
